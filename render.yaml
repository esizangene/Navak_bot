services:
  - type: worker
    name: navak-bots
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python run_all.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: REQUIRED_CHANNEL
        value: "@musicnavac"
      - key: CHANNEL_JOIN_URL
        value: "https://t.me/musicnavac"
      - key: BALE_BOT_TOKEN
        sync: false
      - key: RUBIKA_BOT_TOKEN
        sync: false
